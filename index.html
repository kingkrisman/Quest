<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KÀWÉ · Study smarter</title>
    <meta name="description" content="Flashcards that schedule themselves, practice quizzes, timed exams and live games. Scan a PDF or your notes and start studying in seconds." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KÀWÉ" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta property="og:title" content="KÀWÉ · Study smarter" />
    <meta property="og:description" content="Turn your notes into flashcards, quizzes and exams. Spaced repetition, study games and live quizzes with friends." />
    <meta property="og:image" content="/icon-512.png?v=2" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      try {
        var s = JSON.parse(localStorage.getItem("kawe:v1") || "{}").settings || {};
        var dark = s.theme === "dark" || ((!s.theme || s.theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 32rem; margin: auto">KÀWÉ needs JavaScript to run. Turn it on in your browser settings and reload.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
